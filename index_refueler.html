<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Робоче місце заправника</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body { 
            background: var(--bg-gradient); 
            color: var(--text-main);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card-auth { 
            width: 100%; 
            max-width: 480px; 
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border); 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 30px 32px 36px 32px !important;
        }
        .btn-hub-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
            margin-bottom: 18px;
        }
        .btn-hub-back:hover {
            color: #ffffff;
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.35);
        }
        .logo-block { text-align: center; margin-bottom: 24px; }
        .logo-icon {
            width: 58px; height: 58px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .logo-icon svg { width: 32px; height: 32px; fill: var(--accent); }
        .logo-block h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .logo-block p { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
        .form-label { color: var(--text-muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
        .form-select, .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--text-main) !important;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.95rem;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15) !important;
            outline: none;
        }
        .form-select:disabled { opacity: 0.4; }
        .btn-primary {
            background: var(--accent);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            margin-top: 8px;
        }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.9rem;
        }
        .point-badge {
            font-size: 0.8rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="card card-auth">
    <div>
        <a href="index.html" class="btn-hub-back">⬅ До порталу систем (Головне меню)</a>
    </div>

    <div class="logo-block">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24">
                <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
            </svg>
        </div>
        <h1>Служба ПММ</h1>
        <p id="statusText">Термінал видачі пального / Роздавальні відомості</p>
    </div>

    <form id="refuelerAuthForm">
        <div class="mb-3">
            <label for="categorySelect" class="form-label">Батальйон / Категорія</label>
            <select class="form-select" id="categorySelect" required disabled>
                <option value="" selected disabled>Очікування даних з бази...</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="refuelerSelect" class="form-label">Заправник</label>
            <select class="form-select" id="refuelerSelect" required disabled>
                <option value="" selected disabled>-- Спочатку оберіть категорію --</option>
            </select>
            <div id="pointBadge" class="point-badge d-none">
                Точка видачі: <strong id="lblPointName">-</strong>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-7">
                <label for="monthSelect" class="form-label">Звітний місяць</label>
                <select class="form-select" id="monthSelect" required disabled>
                    <option value="" selected disabled>Завантаження...</option>
                </select>
            </div>
            <div class="col-5">
                <label for="yearSelect" class="form-label">Рік</label>
                <select class="form-select" id="yearSelect" required disabled>
                    <option value="" selected disabled>...</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label for="refuelerPassword" class="form-label">Пароль доступу</label>
            <input type="password" class="form-control" id="refuelerPassword" required placeholder="Введіть пароль...">
        </div>

        <div id="errorDiv" class="alert alert-danger d-none mb-4" role="alert"></div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100" disabled>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
            <span id="btnText">Увійти до терміналу наливу</span>
        </button>
    </form>
</div>

<script>
    const N8N_URL_GET_REFUELERS  = 'https://n8n.pmm-system.com/webhook/v4/get-refuelers-list';
    const N8N_URL_CHECK_REFUELER = 'https://n8n.pmm-system.com/webhook/v4/check-refueler-auth';
    const N8N_URL_LOG_ENTER      = 'https://n8n.pmm-system.com/webhook/v4/log-refuelers-enter';

    const categorySelect   = document.getElementById('categorySelect');
    const refuelerSelect   = document.getElementById('refuelerSelect');
    const monthSelect      = document.getElementById('monthSelect');
    const yearSelect       = document.getElementById('yearSelect');
    const refuelerPassword = document.getElementById('refuelerPassword');
    const errorDiv         = document.getElementById('errorDiv');
    const submitBtn        = document.getElementById('submitBtn');
    const btnText          = document.getElementById('btnText');
    const btnSpinner       = document.getElementById('btnSpinner');
    const pointBadge       = document.getElementById('pointBadge');
    const lblPointName     = document.getElementById('lblPointName');

    let refuelersList = [];
    let allMonthKeys  = [];

    function getDeviceAndBrowser() {
        const ua = navigator.userAgent;
        let device = "PC", browser = "Browser";
        if (/iphone|ipad|ipod/i.test(ua)) device = "iOS";
        else if (/android/i.test(ua)) device = "Android";
        else if (/windows/i.test(ua)) device = "Windows";
        else if (/macintosh/i.test(ua)) device = "Mac";
        else if (/linux/i.test(ua)) device = "Linux";

        if (/chrome|crios/i.test(ua)) browser = "Chrome";
        else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
        else if (/safari/i.test(ua)) browser = "Safari";
        else if (/edg/i.test(ua)) browser = "Edge";
        return { device, browser };
    }

    fetch(N8N_URL_GET_REFUELERS)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP помилка: ${res.status}`);
            return res.json();
        })
        .then(data => {
            let res = Array.isArray(data) ? data[0] : data;
            if (res.json) res = res.json;

            refuelersList = res.refuelers || [];
            allMonthKeys  = res.month_keys || [];

            if (!refuelersList.length || !allMonthKeys.length) {
                throw new Error("База повернула порожні списки заправників або періодів.");
            }

            initCategorySelect(refuelersList);
            initYearAndMonthSelect(allMonthKeys);
        })
        .catch(err => {
            console.error("Критична помилка завантаження структури:", err);
            showError("🔴 Помилка зв'язку з базою даних: не вдалося завантажити довідники.");
        });

    function initCategorySelect(list) {
        categorySelect.innerHTML = '<option value="" selected disabled>-- Оберіть батальйон / категорію --</option>';
        const uniqueCategories = [...new Set(list.map(r => r.category).filter(Boolean))];

        uniqueCategories.forEach(catName => {
            const opt = document.createElement('option');
            opt.value = catName;
            opt.textContent = catName;
            categorySelect.appendChild(opt);
        });

        categorySelect.disabled = false;
    }

    function initYearAndMonthSelect(periods) {
        const uniqueYears = [...new Set(periods.map(m => m.month_key.split('_')[1]).filter(Boolean))].sort().reverse();

        yearSelect.innerHTML = '';
        uniqueYears.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        });

        const todayStr = new Date().toISOString().split('T')[0];
        const activePeriod = periods.find(p => p.start_date && p.end_date && todayStr >= p.start_date && todayStr <= p.end_date);

        let defaultYear = uniqueYears[0];
        let defaultMonthNum = '';

        if (activePeriod) {
            const parts = activePeriod.month_key.split('_');
            defaultMonthNum = parts[0];
            defaultYear = parts[1];
        } else if (periods.length > 0) {
            const parts = periods[0].month_key.split('_');
            defaultMonthNum = parts[0];
            defaultYear = parts[1];
        }

        yearSelect.value = defaultYear;
        yearSelect.disabled = false;

        updateMonthsForYear(defaultYear, defaultMonthNum);

        yearSelect.addEventListener('change', function() {
            updateMonthsForYear(this.value, null);
        });
    }

    function updateMonthsForYear(selectedYear, targetMonthNum) {
        monthSelect.innerHTML = '';
        const monthsForYear = allMonthKeys
            .filter(m => m.month_key.split('_')[1] === selectedYear)
            .sort((a, b) => parseInt(a.month_key.split('_')[0]) - parseInt(b.month_key.split('_')[0]));

        monthsForYear.forEach(m => {
            const num = m.month_key.split('_')[0];
            const opt = document.createElement('option');
            opt.value = num;

            const capitalizedName = m.month_name ? m.month_name.charAt(0).toUpperCase() + m.month_name.slice(1) : '';
            opt.textContent = `${capitalizedName} (${num})`;

            if (targetMonthNum && num === targetMonthNum) {
                opt.selected = true;
            }

            monthSelect.appendChild(opt);
        });

        monthSelect.disabled = false;
    }

    categorySelect.addEventListener('change', function() {
        const selectedCat = this.value;
        errorDiv.classList.add('d-none');
        pointBadge.classList.add('d-none');
        refuelerSelect.innerHTML = '<option value="" selected disabled>-- Оберіть логін заправника --</option>';

        const filtered = refuelersList.filter(r => r.category === selectedCat);

        if (filtered.length > 0) {
            filtered.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.login;
                opt.dataset.pointName = r.point_name;
                opt.dataset.bat = r.bat;
                opt.dataset.pib = r.pib;
                opt.dataset.id = r.id;
                opt.textContent = r.login;
                refuelerSelect.appendChild(opt);
            });
            refuelerSelect.disabled = false;
        } else {
            refuelerSelect.innerHTML = '<option value="" selected disabled>-- Немає заправників у цій категорії --</option>';
            refuelerSelect.disabled = true;
            submitBtn.disabled = true;
        }
    });

    refuelerSelect.addEventListener('change', function() {
        const opt = this.options[this.selectedIndex];
        if (opt && opt.dataset.pointName) {
            lblPointName.innerText = `${opt.dataset.pointName} (${opt.dataset.bat})`;
            pointBadge.classList.remove('d-none');
            submitBtn.disabled = false;
        }
    });

    function showError(message) {
        errorDiv.innerText = message;
        errorDiv.classList.remove('d-none');
        submitBtn.disabled = false;
        btnText.innerText = 'Увійти до терміналу наливу';
        btnSpinner.classList.add('d-none');
    }

    document.getElementById('refuelerAuthForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const category = categorySelect.value;
        const login = refuelerSelect.value;
        const selectedOption = refuelerSelect.options[refuelerSelect.selectedIndex];
        const pointName = selectedOption.dataset.pointName || '';
        const bat = selectedOption.dataset.bat || '';
        const pib = selectedOption.dataset.pib || '';
        const refuelerId = selectedOption.dataset.id || '';

        const month = monthSelect.value;
        const year = yearSelect.value;
        const monthKey = `${month}_${year}`;
        const pass = refuelerPassword.value.trim();

        if (!pass) {
            showError('Введіть пароль доступу!');
            return;
        }

        errorDiv.classList.add('d-none');
        submitBtn.disabled = true;
        btnText.innerText = 'Авторизація...';
        btnSpinner.classList.remove('d-none');

        const info = getDeviceAndBrowser();

        try {
            const resAuth = await fetch(N8N_URL_CHECK_REFUELER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    login: login,
                    password: pass,
                    category: category,
                    bat: bat,
                    point_name: pointName,
                    month_key: monthKey
                })
            });

            let data = await resAuth.json();
            let res = Array.isArray(data) ? data[0] : data;
            if (res.json) res = res.json;

            if (res && res.success === true) {
                btnText.innerText = 'Успішно! Перехід...';

                sessionStorage.setItem('pmm_refueler_session', JSON.stringify({
                    id: refuelerId,
                    login: login,
                    pib: pib,
                    category: category,
                    bat: bat,
                    point_name: pointName,
                    month_key: monthKey
                }));

                try {
                    await fetch(N8N_URL_LOG_ENTER, {
                        method: 'POST',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: category,
                            sub_unit: pointName,
                            month_key: monthKey,
                            status: `Заправник ${login}: Успішно`,
                            device: info.device,
                            browser: info.browser
                        })
                    });
                } catch (logErr) {}

                window.location.href = `index_PMM_refueler.html?category=${encodeURIComponent(category)}&bat=${encodeURIComponent(bat)}&point_name=${encodeURIComponent(pointName)}&month_key=${encodeURIComponent(monthKey)}&login=${encodeURIComponent(login)}`;
            } else {
                try {
                    await fetch(N8N_URL_LOG_ENTER, {
                        method: 'POST',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: category,
                            sub_unit: pointName,
                            month_key: monthKey,
                            status: `Заправник ${login}: Невірний пароль`,
                            device: info.device,
                            browser: info.browser
                        })
                    });
                } catch (logErr) {}

                showError(res && res.message ? res.message : '❌ Невірний пароль заправника!');
            }
        } catch (err) {
            console.error("Помилка авторизації:", err);
            showError('❌ Помилка з\'єднання з сервером перевірки.');
        }
    });
</script>
</body>
</html>
